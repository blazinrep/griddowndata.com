<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You — GridDownData</title>
<meta name="description" content="Thank you for ordering the Grid-Down Survival Data Kit.">
<link rel="canonical" href="https://griddowndata.com/thank-you.html">
<meta name="robots" content="noindex">
<style>
  :root{
    --charcoal:#1A1F1B;
    --charcoal-2:#232A24;
    --orange:#D35400;
    --text:#E7E9E5;
    --muted:#A9B0A6;
    --line:#3A443B;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--charcoal);color:var(--text);
    font-family:"Helvetica Neue",Arial,sans-serif;line-height:1.6;
    display:flex;align-items:center;justify-content:center;min-height:100vh;
    padding:24px;
  }
  .card{
    max-width:620px;background:var(--charcoal-2);border:1px solid var(--line);
    border-radius:6px;padding:48px;text-align:center;
  }
  .brand{
    font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:1.05rem;margin-bottom:28px;
  }
  .brand span{color:var(--orange)}
  h1{font-size:clamp(1.8rem,5vw,2.6rem);margin-bottom:16px}
  .hl{color:var(--orange)}
  p{color:var(--muted);font-size:1.05rem;margin:14px 0}
  .order{
    display:block;width:fit-content;max-width:100%;margin:18px auto 0;
    background:var(--charcoal);border:1px solid var(--line);border-radius:4px;
    padding:10px 16px;font-family:monospace;color:var(--text);font-size:.95rem;
    word-break:break-all;text-align:center;
  }
  a.cta{
    display:inline-block;margin-top:30px;background:var(--orange);color:#fff;text-decoration:none;
    font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:14px 28px;border-radius:3px;
  }
</style>
</head>
<body>
  <main class="card">
    <a href="/" style="display: block; width: fit-content; margin: 0 auto 28px auto;">
      <img src="/assets/images/grid-down-logo.png" alt="Grid Down" style="height: 104px; width: auto; display: block;">
    </a>
    <h1 id="headline">Thank you. <span class="hl">Your order is confirmed.</span></h1>
    <p id="message">We received your order and are confirming payment now. You’ll get an email receipt from Stripe, and we’ll ship your Grid-Down Survival Data Kit within 1–2 business days.</p>
    <p>Order reference:</p>
    <div class="order" id="orderRef">—</div>
    <div>
      <a class="cta" id="downloadBtn" href="#" style="display:none">Download your Blueprint</a>
      <a class="cta" id="homeBtn" href="/" style="background:#3A443B">Back to GridDownData</a>
    </div>
    <div id="osPackList" style="display:none;text-align:left;margin-top:26px"></div>
  </main>
  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const sessionId = params.get('session_id');
      const product = params.get('product');
      if (sessionId) {
        document.getElementById('orderRef').textContent = sessionId;
      }
      // Digital order: swap to download-oriented copy and reveal the button.
      if (product === 'diy-guide') {
        document.getElementById('headline').innerHTML =
          'Thank you. <span class="hl">Your blueprint is ready.</span>';
        document.getElementById('message').textContent =
          'Your Grid-Down Data Blueprint has been emailed to you as a PDF attachment. ' +
          'You can also download it instantly below — once saved, it works with no internet.';
        const dl = document.getElementById('downloadBtn');
        if (sessionId && dl) {
          const url = '/api/download?session_id=' + encodeURIComponent(sessionId);
          dl.href = url;
          dl.style.display = 'inline-block';
          // Auto-retry on cold-start 5xx so a transient hiccup is invisible.
          dl.addEventListener('click', async function(e) {
            e.preventDefault();
            const label = dl.textContent;
            dl.textContent = 'Preparing…'; dl.style.pointerEvents = 'none';
            for (let attempt = 0; attempt < 4; attempt++) {
              try {
                const r = await fetch(url, { cache: 'no-store' });
                if (r.ok) {
                  const blob = await r.blob();
                  const a = document.createElement('a');
                  a.href = URL.createObjectURL(blob);
                  a.download = 'grid-down-data-blueprint.pdf';
                  document.body.appendChild(a); a.click(); a.remove();
                  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
                  dl.textContent = label; dl.style.pointerEvents = '';
                  return;
                }
              } catch (err) { /* network blip — fall through to retry */ }
              await new Promise(function(res){ setTimeout(res, 800 * (attempt + 1)); });
            }
            // All retries failed — fall back to a direct navigation.
            dl.textContent = label; dl.style.pointerEvents = '';
            window.location.href = url;
          });
        }
      }
      // OS Pack order: multiple large files, delivered as direct R2 links.
      // Each file downloads straight from R2 (not through this site), so
      // there's no single "Download" button — just a list, one per file.
      if (product === 'os-pack') {
        document.getElementById('headline').innerHTML =
          'Thank you. <span class="hl">Your OS Pack is ready.</span>';
        document.getElementById('message').textContent =
          'Your OS Pack is a large bundle (~86GB across several files), so it is delivered as direct ' +
          'download links below and by email — download them one at a time. Links are valid for 48 hours.';
        var listEl = document.getElementById('osPackList');
        if (sessionId && listEl) {
          listEl.style.display = 'block';
          listEl.innerHTML = '<p style="color:#A9B0A6;text-align:center">Preparing your download links…</p>';
          fetch('/api/os-pack-links?session_id=' + encodeURIComponent(sessionId), { cache: 'no-store' })
            .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
            .then(function (res) {
              if (!res.ok || !res.d.files) {
                listEl.innerHTML = '<p style="color:#E5484D;text-align:center">' +
                  (res.d && res.d.error ? res.d.error : 'Could not load your downloads. Please contact support.') +
                  '</p>';
                return;
              }
              var rows = res.d.files.map(function (f) {
                return '<a href="' + f.url + '" style="display:flex;justify-content:space-between;gap:12px;' +
                  'background:#1A1F1B;border:1px solid #3A443B;border-radius:4px;padding:14px 18px;margin:8px 0;' +
                  'color:#E7E9E5;text-decoration:none;font-weight:700">' +
                  '<span>' + f.label + '</span><span style="color:#D35400">Download →</span></a>';
              }).join('');
              listEl.innerHTML = rows;
            })
            .catch(function () {
              listEl.innerHTML = '<p style="color:#E5484D;text-align:center">Network error loading your downloads. Refresh to try again.</p>';
            });
        }
      }
    })();
  </script>
</body>
</html>

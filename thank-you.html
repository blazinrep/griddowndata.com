<!DOCTYPE html>
<html lang="en">
<head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-ZLH3SR1EZM"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-ZLH3SR1EZM');

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You — GridDownData</title>
<meta name="description" content="Thank you for ordering the Grid-Down Survival Data Kit.">
<link rel="canonical" href="https://griddowndata.com/thank-you.html">
<meta name="robots" content="noindex">
<style>
  :root{
    --charcoal:#1A1F1B;
    --charcoal-2:#232A24;
    --orange:#D35400;
    --text:#E7E9E5;
    --muted:#A9B0A6;
    --line:#3A443B;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--charcoal);color:var(--text);
    font-family:"Helvetica Neue",Arial,sans-serif;line-height:1.6;
    display:flex;align-items:center;justify-content:center;min-height:100vh;
    padding:24px;
  }
  .card{
    max-width:620px;background:var(--charcoal-2);border:1px solid var(--line);
    border-radius:6px;padding:48px;text-align:center;
  }
  .brand{
    font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:1.05rem;margin-bottom:28px;
  }
  .brand span{color:var(--orange)}
  h1{font-size:clamp(1.8rem,5vw,2.6rem);margin-bottom:16px}
  .hl{color:var(--orange)}
  p{color:var(--muted);font-size:1.05rem;margin:14px 0}
  .order{
    display:block;width:fit-content;max-width:100%;margin:18px auto 0;
    background:var(--charcoal);border:1px solid var(--line);border-radius:4px;
    padding:10px 16px;font-family:monospace;color:var(--text);font-size:.95rem;
    word-break:break-all;text-align:center;
  }
  a.cta{
    display:inline-block;margin-top:30px;background:var(--orange);color:#fff;text-decoration:none;
    font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:14px 28px;border-radius:3px;
  }
</style>
</head>
<body>
  <main class="card">
    <a href="/" style="display: block; width: fit-content; margin: 0 auto 28px auto;">
      <img src="/assets/images/grid-down-logo.png" alt="Grid Down" style="height: 104px; width: auto; display: block;">
    </a>
    <h1 id="headline">Thank you. <span class="hl">Your order is confirmed.</span></h1>
    <p id="message">We received your order and are confirming payment now. You’ll get an email receipt from Stripe, and we’ll ship your Grid-Down Survival Data Kit within 1–2 business days.</p>
    <p>Order reference:</p>
    <div class="order" id="orderRef">—</div>
    <div>
      <a class="cta" id="downloadBtn" href="#" style="display:none">Download your Blueprint</a>
      <a class="cta" id="homeBtn" href="/" style="background:#3A443B">Back to GridDownData</a>
    </div>
  </main>
  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const sessionId = params.get('session_id');
      const product = params.get('product');
      if (sessionId) {
        document.getElementById('orderRef').textContent = sessionId;
      }
      // Digital order: swap to download-oriented copy and reveal the button.
      if (product === 'diy-guide') {
        document.getElementById('headline').innerHTML =
          'Thank you. <span class="hl">Your blueprint is ready.</span>';
        document.getElementById('message').textContent =
          'Your Grid-Down Data Blueprint has been emailed to you as a PDF attachment. ' +
          'You can also download it instantly below — once saved, it works with no internet.';
        const dl = document.getElementById('downloadBtn');
        if (sessionId && dl) {
          dl.href = '/api/download?session_id=' + encodeURIComponent(sessionId);
          dl.style.display = 'inline-block';
        }
      }
    })();
  </script>
</body>
</html>
